# Continuous verification of the tool's own suite and of this repo's ledger.
#
# The matrix makes the cross-platform claim (LF/UTF-8-no-BOM writes, the
# msvcrt/fcntl mutation lock, CRLF self-repair) continuously true on both
# Windows and Linux, on the oldest supported interpreter and the newest.
#
# fetch-depth: 0 is load-bearing: tests/test_dogfood.py runs
# `ledger validate --coverage --strict`, which refuses shallow clones rather
# than passing vacuously.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test runner (the tool itself has no dependencies)
        run: python -m pip install --upgrade pip pytest
      - name: Run the suite
        run: python -m pytest
