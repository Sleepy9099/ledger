# The review UI is a separate package on purpose: `ledger init` vendors only
# .ledger/ledger.py, and the root package stays dependency-free. This one
# may depend on a GUI stack. Install: `pip install -e ui` (or
# `pipx install ./ui`); add `[native]` for the desktop-window mode.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-ui"
version = "0.1.0"
description = "Read-only review UI for Ledger task ledgers: projects, attention, work, human inbox, dependency graph, activity and validation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["nicegui>=3.17,<4"]

[project.optional-dependencies]
native = ["pywebview>=5"]
dev = ["pytest"]

[project.scripts]
ledger-ui = "ledger_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
